version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3

  hellcat-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8888:8888"
    environment:
      - HELLCAT_HOST=0.0.0.0
      - HELLCAT_PORT=8888
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    command: hellcat server

  celery-scan:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A hellcat.core.tasks worker -Q scan -c 4 --loglevel=info

  celery-ai:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A hellcat.core.tasks worker -Q ai -c 2 --loglevel=info
