[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "hellcat"
version = "1.0.0a1"
description = "AI-Driven Autonomous Penetration Testing Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Coff0xc"}]
keywords = ["pentest", "security", "red-team", "mcp", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "fastmcp>=1.0.0",
    "flask>=3.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0,<4.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.12.0,<2.0.0",
    "anthropic>=0.18.0,<1.0.0",
    "ollama>=0.2.0",
]
recon = [
    "python-nmap>=0.7.0",
    "shodan>=1.30.0",
    "dnspython>=2.6.0",
    "python-whois>=0.9.0",
]
network = [
    "impacket>=0.11.0",
    "paramiko>=3.4.0",
    "websockets>=12.0",
]
browser = [
    "selenium>=4.15.0",
    "playwright>=1.40.0",
    "webdriver-manager>=4.0.0",
]
celery = [
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "flask-socketio>=5.3.0",
]
binary = [
    "pwntools>=4.10.0",
    "angr>=9.2.0",
]
report = [
    "reportlab>=4.0.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]
full = [
    "hellcat[ai,recon,network,browser,celery,binary,report]",
]

[project.scripts]
hellcat = "hellcat.cli:main"

[project.entry-points."mcp.servers"]
hellcat = "hellcat.hellcat_mcp:mcp"

[tool.hatch.build.targets.wheel]
packages = ["hellcat"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B"]
ignore = ["S101"]  # allow assert in tests; S603/S607 re-enabled for shell safety

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
